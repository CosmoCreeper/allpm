name: Publish to npm and jsr

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun lint
      - run: bun test
      - run: bun run build
      - run: bun publish
        env:
          NPM_CONFIG_TOKEN: ${{secrets.npm_token}}
      - run: bunx jsr publish

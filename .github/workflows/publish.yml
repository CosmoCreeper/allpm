name: Publish to npm and jsr

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registries: https://registry.npmjs.org/
      - run: bun install
      - run: bun lint
      - run: bun test
      - run: bun run build
      - name: Publish to NPM
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.npm_token }}
        run: bun publish -p --access public
      - run: bunx jsr publish
